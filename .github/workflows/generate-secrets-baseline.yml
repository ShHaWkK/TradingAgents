name: Generate detect-secrets baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"
      - name: Generate baseline
        run: detect-secrets scan --all-files > generated.secrets.baseline
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-baseline
          path: generated.secrets.baseline
          if-no-files-found: error
